<svg xmlns="http://www.w3.org/2000/svg" width="960" height="436" viewBox="0 0 960 436" role="img" aria-labelledby="title desc">
<title id="title">Where the sub-barcode bound is attained</title>
<desc id="desc">Table 1 of the paper. Degree 0, any complex: always attained (Theorem 5), by f_U in near-linear time. Degree d-1, full subcomplex of a triangulated d-sphere: always (Theorem 8), by f_D. Degrees 1 to d-2 on triangulated d-spheres, d at least 3: can fail, even for counts (Theorem 21). Graphs, degree 1: always (Proposition 15), by u. Compact surfaces, degree 1: finite bars always (Theorem 10), by f_D; every box if and only if the surface is planar (Theorem 11); decided in polynomial time with at most n+1 candidates (Theorem 13). 2-complexes, degree 1: can fail, even for counts (Examples 18 and 20).</desc>
