<svg xmlns="http://www.w3.org/2000/svg" width="960" height="352" viewBox="0 0 960 352" role="img" aria-labelledby="title desc">
<title id="title">How the repository fits together</title>
<desc id="desc">How the parts of the repository fit together. The notebook produced the archived run in results/ (FULL, 71.7 minutes, seed 20260925), from which every table, figure and number of the paper is taken. make fingerprint checks that the notebook is the code of the reported run, make verify checks the 84 files against SHA256SUMS and the 60 checksums the run recorded, and make claims recomputes the 95 numbers quoted in the paper. The subbarcode package is compared with brute-force rank computations over GF(2); make test runs 256 tests.</desc>
